<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Vocabulary Match 詞彙配對練習</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 0;
        user-select: none; 
    }
    .header {
        background-color: #2c7a8c;
        color: white;
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
    }
    .container {
        display: flex;
        justify-content: space-around;
        padding: 20px;
    }
    .column {
        width: 45%;
    }
    .title {
        background-color: #1f5f75;
        color: white;
        padding: 10px;
        font-size: 20px;
        text-align: center;
        margin-bottom: 10px;
    }
    .box {
        background-color: #e3e8ee;
        margin: 10px 0;
        padding: 15px;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
    }

    .box:hover:not(.matched) {
        background-color: #d0d7de;
    }

    .box.selected {
        background-color: #cce5ff;
        border-color: #004085;
    }

    .box.matched {
        background-color: #d4edda;
        border-color: #28a745;
        color: #155724;
        cursor: default;
    }

    .box.wrong {
        background-color: #f8d7da;
        border-color: #dc3545;
        color: #721c24;
    }
    .control-panel {
        text-align: center;
        margin: 20px;
    }
    .btn {
        background-color: #2c7a8c;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        margin: 0 10px;
    }
    .btn:hover {
        background-color: #1f5f75;
    }
    .msg-box {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        height: 30px;
        margin-top: 10px;
    }
    .footer {
        text-align: center;
        color: #555;
        margin-bottom: 20px;
        margin-top: 30px;
    }
</style>
</head>

<body>

<div class="header">📘 Vocabulary Match 詞彙配對練習</div>

<div class="container">
    
    <!-- Words -->
    <div class="column" id="words-col">
        <div class="title">Words 詞彙</div>
        <div class="box" data-id="1">1. salty 鹹的</div>
        <div class="box" data-id="2">2. ocean 海洋</div>
        <div class="box" data-id="3">3. fresh 淡（水）</div>
        <div class="box" data-id="4">4. surface 表面</div>
        <div class="box" data-id="5">5. crop 農作物</div>
    </div>

    <!-- Meanings -->
    <div class="column" id="meanings-col">
        <div class="title">Meanings 意義</div>
        <div class="box" data-match="3">a) not salty 不含鹽分的</div>
        <div class="box" data-match="1">b) having the taste of salt 有鹽的味道</div>
        <div class="box" data-match="4">c) the outside of something 某物的外表面</div>
        <div class="box" data-match="2">d) a very large sea 非常大的海</div>
        <div class="box" data-match="5">e) plants grown for food 為食物而種植的植物</div>
    </div>

</div>

<div class="control-panel">
    <button class="btn" onclick="resetGame()">重新開始 Reset</button>
    <div class="msg-box" id="message"></div>
</div>

<script>
    let selectedWord = null;
    let selectedMeaning = null;
    let matchedCount = 0;

    document.querySelectorAll('#words-col .box').forEach(box => {
        box.addEventListener('click', function() {
            if (this.classList.contains('matched')) return;
            

            if (selectedWord) selectedWord.classList.remove('selected');
            
            this.classList.add('selected');
            selectedWord = this;
            
            checkMatch();
        });
    });


    document.querySelectorAll('#meanings-col .box').forEach(box => {
        box.addEventListener('click', function() {
            if (this.classList.contains('matched')) return;

            if (selectedMeaning) selectedMeaning.classList.remove('selected');
            
            this.classList.add('selected');
            selectedMeaning = this;
            
            checkMatch();
        });
    });

    function checkMatch() {
        if (selectedWord && selectedMeaning) {
            const wordId = selectedWord.getAttribute('data-id');
            const meaningMatchId = selectedMeaning.getAttribute('data-match');
            
            const w = selectedWord;
            const m = selectedMeaning;

            if (wordId === meaningMatchId) {

                w.classList.remove('selected');
                m.classList.remove('selected');
                w.classList.add('matched');
                m.classList.add('matched');
                matchedCount++;
                
                if (matchedCount === 5) {
                    document.getElementById('message').innerHTML = "<span style='color: green;'>🎉 太棒了！全部答對！ Excellent!</span>";
                }
            } else {

                w.classList.add('wrong');
                m.classList.add('wrong');

                setTimeout(() => {
                    w.classList.remove('selected', 'wrong');
                    m.classList.remove('selected', 'wrong');
                }, 1000);
            }
            

            selectedWord = null;
            selectedMeaning = null;
        }
    }


    function resetGame() {
        document.querySelectorAll('.box').forEach(box => {
            box.className = 'box';
        });
        document.getElementById('message').innerText = "";
        selectedWord = null;
        selectedMeaning = null;
        matchedCount = 0;
    }
</script>

</body>
</html>
